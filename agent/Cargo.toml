[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
axum = "0.8.9"
tokio = { version = "1.53.3", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "fs",
  "io-util"
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
eyre = "0.6.14"
regex = "1.13.1"
walkdir = "2.5.0"
serde_norway = "0.9.42"
xmltree = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tar = "0.4.46"
zstd = "0.14.3"
ignore = "0.4.33"
mime_guess = "2.0.5"
chrono = "0.4.45"
libc = "0.2.191"
futures-util = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.28.0", features = ["v4"] }

[[bin]]
name = "smaug-agent"
path = "src/main.rs"
