[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-extra",
  "axum-extra-cookie",
  "axum-extra-headers",
  "axum-json",
  "axum-query",
  "axum-tokio",
  "axum-ws",
  "macros"
] }
axum = { version = "0.8.9", features = ["macros", "tracing", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
centaurus = { version = "0.17.7", features = ["uuid"] }
chrono = "0.4.45"
dashmap = "6.2.1"
dotenvy = "0.15.7"
entity = { path = "entity" }
figment = { version = "0.10.19", features = ["env"] }
futures-util = "0.3.34"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
migration = { path = "migration" }
reqwest = { version = "0.13.5", features = ["form", "json"] }
rsa = "0.9.10"
schemars = { version = "1.2.3", features = [
  "chrono04",
  "indexmap2",
  "url2",
  "uuid1"
] }
sea-orm = { version = "2.0.4", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite"
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["signal"] }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
  "url"
] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4"] }
reqwest-middleware = { version = "0.5.2", features = [
  "rustls",
  "http2",
  "json",
  "charset",
  "query"
] }
rand = "0.10.3"
regex = "1.13.1"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }

[features]
# only used for testing purposes
test = ["centaurus/test"]

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
reqwest = { version = "=0.13.5", features = ["form", "json"] }
# tests build ordered request bodies with `json!`; the server itself parses
# ordered maps straight into `IndexMap` and does not need it
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
base64 = "=0.23.1"
rsa = "=0.9.10"
uuid = { version = "=1.28.0", features = ["v4"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
