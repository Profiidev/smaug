services:
  frontend:
    image: ghcr.io/profiidev/images/node-gnu-dev:main@sha256:b4a6c1296d51acf251868f8f54b64f3f6e2fe9c174ad283439b91933de530a59
    restart: unless-stopped
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    volumes:
      - ./frontend:/app/frontend
      - ./node_modules:/app/node_modules
      - ./package-lock.json:/app/package-lock.json
      - ./package.json:/app/package.json
    tty: true
    ports:
      - '5174:5174'
    networks:
      - nginx
    working_dir: /app/frontend
    command: npm run dev -- --host
    #command: npm i

  backend:
    image: ghcr.io/profiidev/images/rust-musl-watch:main@sha256:b394c8a18efd983d74234fea57cf26f4abf5c79afcafc63d6e2997d3ab9b5441
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    volumes:
      - ./.cargo:/app/.cargo
      - ./backend:/app
      - ./shared:/shared
    networks:
      - nginx
    tty: true
    ports:
      - '5173:8000'
    entrypoint: ['tini', '--']
    command: ['cargo', 'watch', '-x', 'run']
    depends_on:
      postgres:
        condition: service_healthy

  wings:
    image: ghcr.io/profiidev/images/rust-musl-watch:main@sha256:b394c8a18efd983d74234fea57cf26f4abf5c79afcafc63d6e2997d3ab9b5441
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    restart: unless-stopped
    volumes:
      - ./wings:/app
      - ./shared:/shared
    networks:
      - nginx
    tty: true
    ports:
      - '8123:8000'
    entrypoint: ['tini', '--']
    command: ['cargo', 'watch', '-x', 'run']

  postgres:
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: unless-stopped
    volumes:
      - ./postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=test
    networks:
      - nginx
    ports:
      - '9301:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'test']
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

networks:
  nginx:
