[package]
name = "wings"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
centaurus_wings = { version = "0.16.2", features = [
  "backend",
  "openapi",
  "auth",
  "config_site",
  "logging",
  "metrics",
  "uuid",
  "hmac"
], default-features = false, package = "centaurus" }
uuid = { version = "1.23.4", features = ["v4"] }
axum = { version = "0.8.9", features = ["macros", "ws", "tracing"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tracing = "0.1.44"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tokio = { version = "1.52.3", features = ["signal"] }
http = "1.4.2"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
figment = { version = "0.10.19", features = ["env"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
serde_json = "1.0.150"
aide = { version = "0.16.0-alpha.4", features = ["axum"] }

[[bin]]
name = "wings"
path = "src/main.rs"
