[package]
name = "wings"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
centaurus_wings = { version = "0.17.7", features = [
  "backend",
  "openapi",
  "auth",
  "config_site",
  "logging",
  "metrics",
  "uuid",
  "hmac"
], default-features = false, package = "centaurus" }
uuid = { version = "1.28.0", features = ["v4"] }
axum = { version = "0.8.9", features = ["macros", "ws", "tracing"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tracing = "0.1.44"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tokio = { version = "1.53.3", features = ["signal", "macros"] }
http = "1.5.0"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
figment = { version = "0.10.19", features = ["env"] }
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
serde_json = "1.0.154"
aide = { version = "0.16.0-alpha.4", features = ["axum"] }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
kube = { version = "4.2.0", default-features = false, features = [
  "client",
  "derive",
  "rustls-tls",
  "aws-lc-rs"
] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
schemars = { version = "1.2.3", features = ["chrono04", "uuid1"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "wings"
path = "src/main.rs"
