[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
centaurus = { version = "0.17.10", default-features = false, features = [
  "error",
  "http"
] }
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
rand = "0.10.4"
schemars = { version = "1.2.3", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
uuid = { version = "1.29.3", features = ["serde"] }

[lib]
path = "src/lib.rs"
