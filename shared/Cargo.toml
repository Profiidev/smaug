[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
centaurus = { version = "0.17.7", default-features = false, features = [
  "error"
] }
chrono = "0.4.45"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
rand = "0.10.3"
schemars = { version = "1.2.3", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["serde"] }

[lib]
path = "src/lib.rs"
